<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanilhaÁgil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-emerald-400">PlanilhaÁgil</h1>
            <p class="text-slate-400 text-sm">Busca por Cliente & Gestão Instantânea</p>
        </div>

        <!-- Rotina da Manhã -->
        <div class="space-y-2">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rotina da Manhã</h2>
            <button onclick="executarManha()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl transition shadow-lg">
                🌅 Executar Atualizado (Manhã)
            </button>
        </div>

        <!-- Busca de Cliente -->
        <div class="space-y-3 pt-2 border-t border-slate-700">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Localizar Cliente</h2>
            <div class="flex gap-2">
                <input type="text" id="buscaNome" placeholder="Digite o nome do cliente..." class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                <button onclick="buscarCliente()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm font-medium transition">Buscar</button>
            </div>
        </div>

        <!-- Cartão do Cliente Encontrado -->
        <div id="cartaoCliente" class="hidden bg-slate-700/50 border border-slate-600 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <h3 id="cliNome" class="font-bold text-emerald-300 text-base"></h3>
                <span id="cliContrato" class="text-xs bg-slate-600 px-2 py-1 rounded text-slate-300"></span>
            </div>
            
            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-800/40 p-3 rounded-lg">
                <div>Valor Pego: <span id="cliPego" class="font-semibold text-white"></span></div>
                <div>Valor Pago: <span id="cliPago" class="font-semibold text-white"></span></div>
                <div>Parcela: <span id="cliParcela" class="font-semibold text-white"></span></div>
                <div>Multas: <span id="cliMultas" class="font-semibold text-white"></span></div>
                <div>Início: <span id="cliInicio" class="font-semibold text-white"></span></div>
                <div>Fim: <span id="cliFim" class="font-semibold text-white"></span></div>
                <div class="col-span-2 text-amber-300 pt-2 border-t border-slate-600 text-sm">
                    Pendente: <span id="cliPendente" class="font-bold"></span>
                </div>
            </div>

            <!-- Botões de Lançamento Direto -->
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="lancar('PIX')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition">
                    🟢 PIX
                </button>
                <button onclick="lancar('ESPECIE')" class="bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition">
                    🟣 Espécie
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="lancar('SEMANAL')" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition">
                    🔵 Semanal (Dia)
                </button>
                <button onclick="lancar('NEGOCIADO')" class="bg-pink-500 hover:bg-pink-400 text-white font-medium py-2 px-3 rounded-lg text-xs transition">
                    🌸 Negociado (Rosa)
                </button>
            </div>
            <button onclick="lancar('ATRASO')" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition">
                🔴 Marcar Atraso (A / AA / AAA)
            </button>
        </div>

        <!-- Status / Resposta -->
        <div id="status" class="text-center text-xs text-slate-400 min-h-[20px]"></div>
    </div>

    <script>
        let clienteAtual = null;

        async function buscarCliente() {
            let nome = document.getElementById('buscaNome').value;
            if (!nome) return alert("Digite um nome para buscar!");

            document.getElementById('status').innerText = "Buscando cliente...";
            let res = await fetch(`/api/buscar-cliente?nome=${encodeURIComponent(nome)}`);
            let data = await res.json();

            if (res.ok) {
                clienteAtual = data;
                document.getElementById('cliNome').innerText = data.nome;
                document.getElementById('cliContrato').innerText = data.contrato;
                document.getElementById('cliPego').innerText = "R$ " + data.valor_pego;
                document.getElementById('cliPago').innerText = "R$ " + data.valor_pago;
                document.getElementById('cliParcela').innerText = "R$ " + data.valor_parcela;
                document.getElementById('cliMultas').innerText = "R$ " + data.multas;
                document.getElementById('cliInicio').innerText = data.data_inicio;
                document.getElementById('cliFim').innerText = data.data_fim;
                document.getElementById('cliPendente').innerText = "R$ " + data.pendente;
                
                document.getElementById('cartaoCliente').classList.remove('hidden');
                document.getElementById('status').innerText = "";
            } else {
                document.getElementById('cartaoCliente').classList.add('hidden');
                document.getElementById('status').innerText = data.erro;
            }
        }

        async function lancar(tipo) {
            if (!clienteAtual) return;

            let valor = 0;
            let statusAtraso = 'A';
            let textoNegocio = '';

            if (tipo === 'PIX' || tipo === 'ESPECIE') {
                let valStr = prompt("Digite o valor recebido (R$):");
                if (!valStr) return;
                valor = parseFloat(valStr);
            } else if (tipo === 'SEMANAL') {
                let valStr = prompt("Digite o valor e/ou o dia da semana (ex: 75 - Sexta):");
                if (!valStr) return;
                // Tenta extrair número se houver, ou aceita como valor/texto
                let matchNum = valStr.match(/[0-9.]+/);
                valor = matchNum ? parseFloat(matchNum[0]) : 0;
            } else if (tipo === 'NEGOCIADO') {
                textoNegocio = prompt("Digite a data ou anotação do Negociado (Ex: 05/09 ou Acordo):", "05/09");
                if (!textoNegocio) return;
            } else if (tipo === 'ATRASO') {
                statusAtraso = prompt("Digite o status de atraso (A, AA, AAA, etc):", "A");
                if (!statusAtraso) return;
            }

            document.getElementById('status').innerText = "Processando lançamento...";
            let res = await fetch('/api/lancar-noite', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    linha: clienteAtual.linha, 
                    tipo: tipo, 
                    valor: valor, 
                    status: statusAtraso,
                    texto: textoNegocio
                })
            });
            let data = await res.json();
            document.getElementById('status').innerText = data.mensagem || data.erro;
            if (res.ok) {
                setTimeout(buscarCliente, 800); 
            }
        }

        async function executarManha() {
            document.getElementById('status').innerText = "Executando rotina da manhã...";
            let res = await fetch('/api/lancar-manha', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            });
            let data = await res.json();
            document.getElementById('status').innerText = data.mensagem || data.erro;
        }
    </script>
</body>
</html>
